name: Build Signed Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Generate and sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Decode release keystore and write keystore.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Error: Missing required Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/release-keystore.jks
          cat <<EOF > android/keystore.properties
          storeFile=release-keystore.jks
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Configure release signing in android/app/build.gradle
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let gradle = fs.readFileSync(path, "utf8");
            if (!gradle.includes("signingConfigs")) {
              const signingBlock = [
                "    signingConfigs {",
                "        release {",
                "            def keystorePropertiesFile = rootProject.file(\"keystore.properties\")",
                "            if (keystorePropertiesFile.exists()) {",
                "                def keystoreProperties = new Properties()",
                "                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))",
                "                storeFile rootProject.file(keystoreProperties[\"storeFile\"])",
                "                storePassword keystoreProperties[\"storePassword\"]",
                "                keyAlias keystoreProperties[\"keyAlias\"]",
                "                keyPassword keystoreProperties[\"keyPassword\"]",
                "            }",
                "        }",
                "    }",
                "    buildTypes {"
              ].join("\n");
              gradle = gradle.replace(/^\s*buildTypes\s*\{/m, signingBlock);
              gradle = gradle.replace(
                /(buildTypes\s*\{[\s\S]*?release\s*\{)/,
                "$1\n            signingConfig signingConfigs.release"
              );
              fs.writeFileSync(path, gradle, "utf8");
            }
          '

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload app-release.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
